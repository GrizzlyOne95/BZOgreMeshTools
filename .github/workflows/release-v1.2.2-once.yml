name: Release BZOgreMeshTools v1.2.2 Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.2.2-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify Python syntax
        run: |
          python -m py_compile ogre_mesh_tools_gui.py ogre_preview.py recalculate_normals.py

      - name: Build Windows executable
        run: python -m PyInstaller OgreMeshTools.spec --noconfirm

      - name: Verify release asset
        shell: pwsh
        run: |
          $asset = Get-Item .\dist\OgreMeshTools_Windows.exe
          if ($asset.Length -lt 1000000) { throw "Release asset is unexpectedly small: $($asset.Length) bytes" }

      - name: Create v1.2.2 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          target_commitish: ${{ github.sha }}
          name: Release v1.2.2
          body_path: docs/RELEASE_NOTES_v1.2.2.md
          files: dist/OgreMeshTools_Windows.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
